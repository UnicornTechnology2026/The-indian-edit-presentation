    /* ------------------------------------------------------------------ */
    /* Slide                                                               */

    function ProcessFlow() {
      const [step, setStep] = useState(0);
      const [playing, setPlaying] = useState(false);
      const [branch, setBranch] = useState('no'); // 'yes' | 'no' — only used on decision steps
      const railRef = React.useRef(null);

      // Manual selection stops autoplay and defaults decisions to their "No" view.
      const select = (index) => {
        setPlaying(false);
        setStep(index);
        setBranch('no');
      };

      const togglePlay = () => {
        if (playing) return setPlaying(false);
        if (step >= LAST) setStep(0);
        setPlaying(true);
      };

      // While playing the journey succeeds, so decisions show their "Yes" path.
      useEffect(() => {
        setBranch(playing ? 'yes' : 'no');
      }, [step]);

      // Autoplay: advance one step at a time, stop at the end.
      useEffect(() => {
        if (!playing) return;
        if (step >= LAST) {
          setPlaying(false);
          return;
        }
        const timer = setTimeout(() => setStep((s) => s + 1), STEP_DELAY_MS);
        return () => clearTimeout(timer);
      }, [playing, step]);

      // Keep the active node in view on narrow screens (the track scrolls sideways).
      useEffect(() => {
        const node = railRef.current && railRef.current.querySelector('[data-active="1"]');
        if (node && node.scrollIntoView) {
          node.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
        }
      }, [step]);

      return (
        <div className="p-6 md:p-10">
          <div className="flex flex-wrap items-end justify-between gap-4">
            <Header />
            <Controls
              step={step}
              playing={playing}
              onPrev={() => select(Math.max(0, step - 1))}
              onNext={() => select(Math.min(LAST, step + 1))}
              onTogglePlay={togglePlay}
            />
          </div>

          <Track step={step} branch={branch} onSelect={select} railRef={railRef} />
          <Legend step={step} />
          <DetailPanel step={step} branch={branch} onBranch={setBranch} onSelect={select} />
        </div>
      );
